<!DOCTYPE html>
<html lang="id" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate">
  <title>Absensi Terkirim - ICSO</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function () {
      var saved = localStorage.getItem('icso_theme');
      var theme = saved || 'dark';
      if (theme === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');

      // Access guard: only reachable if attendance was actually submitted today
      var lastAbsen = localStorage.getItem('icso_last_absen');
      var HOURS_24_MS = 24 * 60 * 60 * 1000;
      if (!lastAbsen || (Date.now() - parseInt(lastAbsen, 10) >= HOURS_24_MS)) {
        window.location.replace('index.html');
      }
    })();

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Poppins"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eaf6ff', 100: '#d3ecfe', 200: '#a6d9fd', 300: '#72bff2',
              400: '#4aa4e0', 500: '#2688c9', 600: '#1a6ba6', 700: '#155586',
              800: '#12456c', 900: '#0d3350',
            },
          },
          keyframes: {
            floatup: {
              '0%': { opacity: 0, transform: 'translateY(14px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            pop: {
              '0%': { transform: 'scale(0.6)', opacity: 0 },
              '60%': { transform: 'scale(1.08)', opacity: 1 },
              '100%': { transform: 'scale(1)', opacity: 1 },
            },
            drift: {
              '0%, 100%': { transform: 'translate(0,0)' },
              '50%': { transform: 'translate(10px,-14px)' },
            },
          },
          animation: {
            floatup: 'floatup .55s cubic-bezier(.16,1,.3,1) both',
            pop: 'pop .55s cubic-bezier(.16,1,.3,1) both',
            drift: 'drift 9s ease-in-out infinite',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Poppins', sans-serif; }

    .bg-app { background-color: #0a1220; }
    html:not(.dark) .bg-app { background-color: #eef5fb; }

    .bg-card { background-color: #101b2c; border-color: rgba(114, 191, 242, 0.14); }
    html:not(.dark) .bg-card { background-color: #ffffff; border-color: rgba(38, 136, 201, 0.12); }

    .bg-head { background-color: #0d1826; border-color: rgba(114, 191, 242, 0.14); }
    html:not(.dark) .bg-head { background-color: #f3f9ff; border-color: rgba(38, 136, 201, 0.12); }

    .txt-main { color: #eef4fb; }
    html:not(.dark) .txt-main { color: #0e2438; }

    .txt-muted { color: #7f93ab; }
    html:not(.dark) .txt-muted { color: #4d6b85; }

    .toggle-thumb { transition: transform .3s cubic-bezier(.16,1,.3,1); }
    .dark .toggle-thumb { transform: translateX(20px); }

    .bubble { position: absolute; border-radius: 9999px; background: radial-gradient(circle at 32% 28%, #7fc4f2, #2688c9 65%, #155586); opacity: .55; }
  </style>
</head>

<body class="bg-app txt-main min-h-screen antialiased">

  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="bubble w-40 h-40 -top-10 -right-10 animate-drift"></div>
    <div class="bubble w-24 h-24 top-32 -right-6 animate-drift" style="animation-delay:1.2s"></div>
    <div class="bubble w-16 h-16 top-64 right-16 animate-drift" style="animation-delay:2.4s"></div>
    <div class="bubble w-52 h-52 -bottom-16 -left-16 animate-drift" style="animation-delay:.6s"></div>
    <div class="bubble w-20 h-20 bottom-40 left-24 animate-drift" style="animation-delay:1.8s"></div>
  </div>

  <!-- Navbar -->
  <nav class="border-b bg-head backdrop-blur-md sticky top-0 z-40" style="border-color: rgba(114,191,242,0.14)">
    <div class="flex gap-4 justify-between items-center px-4 py-4 mx-auto max-w-4xl">
      <div class="flex gap-4 items-center">
        <div class="flex overflow-hidden justify-center items-center w-12 h-12 bg-white rounded-full shadow-md ring-1 ring-brand-400/30">
          <img src="logo-icso.png" alt="ICSO" class="object-cover w-full h-full rounded-full">
        </div>
        <div>
          <h1 class="font-display text-xl sm:text-2xl font-bold tracking-wide txt-main">ICSO</h1>
          <p class="text-xs sm:text-sm txt-muted">Informatika Creative Student Organization</p>
        </div>
      </div>

      <button id="themeToggle" type="button" aria-label="Ganti tema terang / gelap"
        class="relative w-12 h-7 rounded-full flex items-center px-1 bg-brand-900/60 border border-brand-400/30 hover:border-brand-400/60 transition-colors shrink-0">
        <span class="toggle-thumb w-5 h-5 rounded-full bg-gradient-to-br from-brand-300 to-brand-600 shadow flex items-center justify-center">
          <i id="themeIcon" class="fa-solid fa-moon text-[10px] text-white"></i>
        </span>
      </button>
    </div>
  </nav>

  <main class="px-4 py-16 mx-auto max-w-2xl relative flex flex-col items-center text-center">
    <div class="w-20 h-20 rounded-full bg-brand-500/15 border border-brand-400/30 flex items-center justify-center animate-pop">
      <i class="fa-solid fa-check text-3xl text-brand-400"></i>
    </div>

    <h1 class="font-display font-bold text-2xl sm:text-3xl mt-7 animate-floatup" style="animation-delay:.1s">
      Absensi Berhasil Dikirim!
    </h1>
    <p id="detailLine" class="mt-3 txt-muted text-sm sm:text-base animate-floatup" style="animation-delay:.15s"></p>
    <p class="mt-4 txt-muted text-sm leading-relaxed max-w-md animate-floatup" style="animation-delay:.2s">
      Terima kasih sudah mengisi absensi hari ini. Kamu bisa mengisi kembali dalam 24 jam ke depan.
    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3 animate-floatup" style="animation-delay:.25s">
      <span id="badgeStatus" class="inline-flex items-center gap-2 text-xs px-4 py-2 rounded-full bg-card border">
        <i class="fa-regular fa-circle-check text-brand-400"></i> Status
      </span>
      <span class="inline-flex items-center gap-2 text-xs px-4 py-2 rounded-full bg-card border">
        <i class="fa-solid fa-people-group text-brand-400"></i> ICSO
      </span>
    </div>
  </main>

  <p class="text-[11px] txt-muted text-center pb-8">
    &copy; <span id="year"></span> Febri Pratama | All Right Reserved
  </p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    $(function () {
      $('#year').text(new Date().getFullYear());

      try {
        var data = JSON.parse(localStorage.getItem('icso_absen_data') || '{}');
        if (data && data.nama) {
          $('#detailLine').text('Halo, ' + data.nama + ' (' + (data.kelas || '-') + ') — absensi tanggal ' + (data.tanggal || '-') + ' sudah tercatat.');
          var isHadir = data.status === 'hadir';
          $('#badgeStatus').html(
            '<i class="fa-regular fa-circle-check text-brand-400"></i> ' +
            (isHadir ? 'Hadir' : 'Tidak Hadir')
          );
        }
      } catch (e) {}

      function reflectThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        $('#themeIcon').attr('class', isDark ? 'fa-solid fa-moon text-[10px] text-white' : 'fa-solid fa-sun text-[10px] text-white');
      }
      reflectThemeIcon();

      $('#themeToggle').on('click', function () {
        var html = document.documentElement;
        html.classList.toggle('dark');
        localStorage.setItem('icso_theme', html.classList.contains('dark') ? 'dark' : 'light');
        reflectThemeIcon();
      });
    });

    window.addEventListener('pageshow', function () {
      var lastAbsen = localStorage.getItem('icso_last_absen');
      var HOURS_24_MS = 24 * 60 * 60 * 1000;
      if (!lastAbsen || (Date.now() - parseInt(lastAbsen, 10) >= HOURS_24_MS)) {
        window.location.replace('index.html');
      }
    });
  </script>
</body>

</html>
